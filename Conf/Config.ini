; -----------------------------------------------------------------------
; Config.ini - Test Framework Configuration
; -----------------------------------------------------------------------

[TestConfig]
; Waiting period (seconds) between polling for file/process completion
PollWaitPeriod = 60

; Run Unit Tests (1) or Regression Tests (0)
; WIN_APPS tests are Unit Tests — keep this set to 1
UnitTests = 1

; -----------------------------------------------------------------------
; Application credentials — NOT used by WIN_APPS tests.
; Retained so the framework's CommonFunctions class can read them without
; raising a ConfigParser error if other modules import CommonFunctions.
; -----------------------------------------------------------------------
[Credentials]
UserName = unused
Password = unused

[Database]
DBUser = unused
DBPassword = unused
DBHost = localhost
DBName = unused

[Deployment]
; Binary folder — not used by WIN_APPS tests
BinFolder = C:\Windows

; -----------------------------------------------------------------------
; Test Framework Behaviour
; -----------------------------------------------------------------------
[TestConf]
; Delay (seconds) between successive test cases
TestDelayInSeconds = 3

; -----------------------------------------------------------------------
; Report Generation Options  (1 = include, 0 = exclude)
; -----------------------------------------------------------------------
[ReportGeneration]
; WIN_APPS tests do not produce a logs sub-folder
Logs = 0
ExpectedResults = 1
ActualResults   = 1
Screenshots     = 1
; WIN_APPS tests do not scan binary versions
VersionInfo     = 0
Glossary        = 1
; Keep PDF disabled by default for easy setup on a clean machine
PDFReport       = 1
